<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Datos Básicos</title>
</head>
<body>
    <h1>Formulario de Datos Básicos</h1>
    
    <form action="/submit" method="POST">
        <div>
            <label for="nombre">Nombre *</label>
            <input type="text" id="nombre" name="nombre" required>
        </div>
        
        <div>
            <label for="apellido">Apellido *</label>
            <input type="text" id="apellido" name="apellido" required>
        </div>
        
        <div>
            <label for="email">Correo Electrónico *</label>
            <input type="email" id="email" name="email" required>
        </div>
        
        <div>
            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono" name="telefono">
        </div>

        <div>
            <label for="Sueldo">Sueldo</label>
            <input type="number" id="Sueldo" name="Sueldo">
        </div>

        <div>
            <label for="Observaciones">Observaciones</label>
            <input type="text" id="Observaciones" name="Observaciones">
        </div>

        <div>
            <label for="Fecha de Nacimiento">Fecha de Nacimiento</label>
            <input type="date" id="Fecha de Nacimiento" name="Fecha de Nacimiento">
        </div>

        <div>
            <label for="edad">Edad</label>
            <input type="number" id="edad" name="edad" min="1" max="120">
        </div>
        
        <div>
            <label for="genero">Género</label>
            <select id="genero" name="genero">
                <option value="">Seleccione una opción</option>
                <option value="masculino">Masculino</option>
                <option value="femenino">Femenino</option>
                <option value="otro">Otro</option>
                <option value="prefiero-no-decir">Prefiero no decir</option>
            </select>
        </div>
        
        <div>
            <label for="direccion">Dirección</label>
            <textarea id="direccion" name="direccion" rows="3"></textarea>
        </div>
        
        <div>
            <button type="submit">Enviar Datos</button>
        </div>
    </form>
</body>
</html>
